name: Project Validation

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run validate:js

      - name: Validate Render health service
        run: npm run validate:render

      - name: Check required project files
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test -f cypress.config.js
          test -f render.yaml
          test -f render_health.js
          test -f cypress/e2e/irctc.cy.js
          test -f cypress/support/commands.js
          echo "Project structure validation passed."
